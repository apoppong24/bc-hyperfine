[project]
name = "quarkonium"
version = "1.0.0"
description = "Numerov solver for heavy quark-antiquark bound states (B_c meson masses MSc project)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quarkonium*"]
